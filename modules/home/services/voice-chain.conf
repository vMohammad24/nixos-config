context.properties = { log.level = 0 }

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { nice.level = -11 rt.prio = 88 }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    { name = libpipewire-module-filter-chain
        args = {
            node.description = "QuadCast S Voice"
            media.name       = "QuadCast S Voice"
            filter.graph = {
                nodes = [
                    {
                        type    = ladspa
                        name    = highpass_l
                        plugin  = "highpass_iir_1890"
                        label   = highpass_iir
                        control = { "Cutoff Frequency" = 90 "Stages(2 poles per stage)" = 2 }
                    }
                    {
                        type    = ladspa
                        name    = highpass_r
                        plugin  = "highpass_iir_1890"
                        label   = highpass_iir
                        control = { "Cutoff Frequency" = 90 "Stages(2 poles per stage)" = 2 }
                    }
                    {
                        type    = ladspa
                        name    = rnnoise
                        plugin  = "librnnoise_ladspa"
                        label   = noise_suppressor_stereo
                        control = {
                            "VAD Threshold (%)"        = 49.5
                            "VAD Grace Period (ms)"    = 500
                            "Retroactive VAD Grace (ms)" = 100
                        }
                    }
                    {
                        type    = lv2
                        name    = expander
                        plugin  = "http://calf.sourceforge.net/plugins/Gate"
                        control = {
                            "level_in"    = 1
                            "range"       = 0.001
                            "threshold"   = 0.008
                            "ratio"       = 6
                            "attack"      = 3
                            "release"     = 120
                            "makeup"      = 1
                            "knee"        = 1
                            "detection"   = 1
                            "stereo_link" = 1
                            "bypass"      = 0
                        }
                    }
                    {
                        type    = lv2
                        name    = deesser
                        plugin  = "http://calf.sourceforge.net/plugins/Deesser"
                        control = {
                            "bypass"    = 0
                            "detection" = 0
                            "mode"      = 0
                            "threshold" = 0.08
                            "ratio"     = 4
                            "laxity"    = 10
                            "makeup"    = 1
                            "f1_freq"   = 6000
                            "f2_freq"   = 4500
                            "f1_level"  = 1
                            "f2_level"  = 4
                            "f2_q"      = 1
                            "sc_listen" = 0
                        }
                    }
                    {
                        type    = lv2
                        name    = eq
                        plugin  = "http://calf.sourceforge.net/plugins/Equalizer12Band"
                        control = {
                            "bypass"    = 0
                            "level_in"  = 1
                            "level_out" = 1
                            "hp_active" = 0
                            "lp_active" = 0
                            "ls_active" = 1
                            "ls_freq"   = 120
                            "ls_level"  = 0.63
                            "ls_q"      = 0.707
                            "hs_active" = 1
                            "hs_freq"   = 9000
                            "hs_level"  = 1.41
                            "hs_q"      = 0.707
                            "p1_active" = 1
                            "p1_freq"   = 250
                            "p1_level"  = 0.63
                            "p1_q"      = 1.0
                            "p2_active" = 1
                            "p2_freq"   = 3500
                            "p2_level"  = 1.41
                            "p2_q"      = 1.0
                        }
                    }
                    {
                        type    = lv2
                        name    = comp
                        plugin  = "http://calf.sourceforge.net/plugins/Compressor"
                        control = {
                            "bypass"      = 0
                            "level_in"    = 1
                            "threshold"   = 0.1
                            "ratio"       = 4
                            "attack"      = 10
                            "release"     = 120
                            "makeup"      = 2.5
                            "knee"        = 3
                            "detection"   = 1
                            "stereo_link" = 1
                            "mix"         = 1
                        }
                    }
                    {
                        type    = lv2
                        name    = limit
                        plugin  = "http://calf.sourceforge.net/plugins/Limiter"
                        control = {
                            "bypass"       = 0
                            "level_in"     = 1
                            "level_out"    = 1
                            "limit"        = 0.95
                            "attack"       = 5
                            "release"      = 50
                            "asc"          = 1
                            "oversampling" = 1
                        }
                    }
                ]

                links = [
                    { output = "highpass_l:Output" input = "rnnoise:Input (L)" }
                    { output = "highpass_r:Output" input = "rnnoise:Input (R)" }
                    { output = "rnnoise:Output (L)" input = "expander:in_l" }
                    { output = "rnnoise:Output (R)" input = "expander:in_r" }
                    { output = "expander:out_l"     input = "deesser:in_l" }
                    { output = "expander:out_r"     input = "deesser:in_r" }
                    { output = "deesser:out_l"      input = "eq:in_l" }
                    { output = "deesser:out_r"      input = "eq:in_r" }
                    { output = "eq:out_l"           input = "comp:in_l" }
                    { output = "eq:out_r"           input = "comp:in_r" }
                    { output = "comp:out_l"         input = "limit:in_l" }
                    { output = "comp:out_r"         input = "limit:in_r" }
                ]

                inputs  = [ "highpass_l:Input" "highpass_r:Input" ]
                outputs = [ "limit:out_l" "limit:out_r" ]
            }

            capture.props = {
                node.name      = "capture.qc_voice"
                audio.rate     = 48000
                audio.channels = 2
                node.target    = "alsa_input.usb-HP__Inc_HyperX_QuadCast_S_4103-00.analog-stereo"
            }

            playback.props = {
                node.name      = "quadcast_voice"
                media.class    = "Audio/Source"
                audio.rate     = 48000
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
